server:
  port: 8888

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  reminder-model: ${ANTHROPIC_REMINDER_MODEL:claude-haiku-4-5-20251001}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:2048}

reminder:
  file-path: ${REMINDER_FILE_PATH:./reminders.json}

claude:
  system-prompt-path: ${CLAUDE_SYSTEM_PROMPT_PATH:classpath:system-prompt.txt}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  secret-token: ${TELEGRAM_SECRET_TOKEN:}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    danny.project.chatbot.telegram: INFO
